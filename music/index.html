<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music — Step-By-Stepper</title>
<script>
  const destination = new URL('../', location.href);
  destination.search = location.search;
  destination.searchParams.set('stepperRoute', 'music');
  destination.hash = location.hash;
  location.replace(destination.href);
</script>
</head>
<body><p><a href="../?stepperRoute=music">Open Music</a></p></body>
</html>
